<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Makanan & Minuman</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1600&q=80") center center/cover no-repeat;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.55);
}

.menu-box{
    position:relative;
    width:90%;
    max-width:450px;
    background:rgba(255,255,255,.95);
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
}

.menu-box h1{
    margin-bottom:25px;
    color:#ff6b35;
    font-size:32px;
}

.menu{
    text-align:left;
}

.item{
    display:flex;
    justify-content:space-between;
    padding:15px 0;
    border-bottom:1px dashed #ccc;
}

.item:last-child{
    border-bottom:none;
}

.nama{
    font-weight:600;
}

.harga{
    color:#ff6b35;
    font-weight:bold;
}

.sub{
    margin-top:35px;
    margin-bottom:15px;
    color:#444;
    text-align:center;
}

footer{
    margin-top:30px;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<div class="menu-box">

<h1>🍽 MENU</h1>

<div class="menu">

<h3 class="sub">Makanan</h3>

<div class="item">
<span class="nama">Nasi Goreng</span>
<span class="harga">Rp18.000</span>
</div>

<div class="item">
<span class="nama">Nasi Ruwet</span>
<span class="harga">Rp22.000</span>
</div>

<div class="item">
<span class="nama">Ayam Geprek</span>
<span class="harga">Rp15.000</span>
</div>

<h3 class="sub">Minuman</h3>

<div class="item">
<span class="nama">Es Teh</span>
<span class="harga">Rp5.000</span>
</div>

<div class="item">
<span class="nama">Es Jeruk</span>
<span class="harga">Rp8.000</span>
</div>

<div class="item">
<span class="nama">Kopi Susu</span>
<span class="harga">Rp10.000</span>
</div>

</div>

<footer>
Selamat Menikmati ❤️
</footer>

</div>

</body>
</html>
