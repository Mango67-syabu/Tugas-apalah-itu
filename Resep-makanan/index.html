<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Resep Nasi Goreng</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body
class="min-h-screen
bg-gradient-to-br
from-orange-100
via-white
to-yellow-100">


<!-- HALAMAN RESEP -->

<section
class="min-h-screen
flex items-center
justify-center
px-4 py-10">


<div
class="bg-white
w-full max-w-6xl
rounded-3xl
shadow-2xl
p-8">


<!-- JUDUL -->

<h1
class="text-4xl
font-bold
text-center
text-gray-800
mb-10">

🍳 Bahan & Resep Makanan

</h1>



<!-- BAGIAN KARTU DAN RESEP -->

<div
class="grid
grid-cols-1
md:grid-cols-2
gap-10
items-center">


<!-- KARTU NASI GORENG -->

<button
onclick="tampilResepNasiGoreng()"
class="border-2
border-gray-800
rounded-2xl
p-8
hover:scale-105
hover:shadow-xl
transition
duration-300">


<!-- GAMBAR NASI GORENG -->

<div
class="w-48
h-48
mx-auto
mb-6
border-4
border-gray-700
rounded-2xl
overflow-hidden">


<img
src="https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=500&q=80"
alt="Nasi Goreng"
class="w-full
h-full
object-cover">


</div>



<!-- NAMA MAKANAN -->

<h2
class="text-3xl
font-bold
text-gray-800
mb-6">

Nasi Goreng

</h2>



<!-- DESKRIPSI -->

<p
class="text-gray-600
text-lg
leading-relaxed">

Nasi goreng adalah makanan khas Indonesia
yang dibuat dari nasi putih, bumbu,
kecap, telur, dan berbagai bahan tambahan.

</p>



<!-- PETUNJUK -->

<p
class="mt-6
text-orange-600
font-bold">

Klik gambar untuk melihat resep 👆

</p>


</button>



<!-- BAGIAN BAHAN DAN RESEP -->

<div
id="resep"
class="border-4
border-gray-800
rounded-3xl
p-8
min-h-[450px]">


<h2
class="text-3xl
font-bold
text-center
text-gray-800
mb-6">

Bahan & Resep

</h2>


<p
class="text-center
text-gray-500
text-lg">

Klik gambar Nasi Goreng
untuk melihat bahan
dan cara membuatnya.

</p>


</div>


</div>



<!-- TOMBOL KEMBALI -->

<a
href="../index.html"
class="block
w-full
mt-10
py-4
rounded-xl
bg-gray-700
text-white
text-center
text-lg
font-semibold
hover:bg-gray-800
hover:scale-105
transition
duration-300">

← Kembali ke Halaman Utama

</a>


</div>

</section>



<!-- JAVASCRIPT -->

<script>


function tampilResepNasiGoreng() {


document
.getElementById("resep")
.innerHTML = `


<h2
class="text-3xl
font-bold
text-center
text-orange-600
mb-6">

🍳 Nasi Goreng

</h2>



<h3
class="text-xl
font-bold
mb-3">

Bahan:

</h3>



<ul
class="list-disc
ml-6
space-y-2
text-gray-700">


<li>

1 piring nasi putih

</li>


<li>

1 butir telur

</li>


<li>

2 siung bawang putih

</li>


<li>

2 siung bawang merah

</li>


<li>

1 sendok makan kecap manis

</li>


<li>

Garam secukupnya

</li>


<li>

Minyak goreng secukupnya

</li>


</ul>



<h3
class="text-xl
font-bold
mt-6
mb-3">

Cara Membuat:

</h3>



<ol
class="list-decimal
ml-6
space-y-2
text-gray-700">


<li>

Panaskan minyak
di dalam wajan.

</li>


<li>

Tumis bawang merah
dan bawang putih.

</li>


<li>

Masukkan telur,
lalu aduk hingga matang.

</li>


<li>

Masukkan nasi putih.

</li>


<li>

Tambahkan kecap
dan garam.

</li>


<li>

Aduk hingga semua
bahan tercampur.

</li>


<li>

Masak hingga matang,
lalu sajikan.

</li>


</ol>


`;


}


</script>


</body>

</html>
