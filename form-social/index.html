<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 via-white to-blue-200">

    <!-- Contact Section -->
    <section id="contact" class="min-h-screen flex items-center justify-center px-4">

        <div class="bg-white w-full max-w-xl rounded-3xl shadow-2xl p-8">

            <h2 class="text-4xl font-bold text-center text-gray-800 mb-2">
                Aduan Sosial
            </h2>

            <form class="space-y-5">

                <!-- Name -->
                <div>
                    <label class="block text-center font-semibold text-gray-700 mb-2">
                        Nama
                    </label>

                    <input
                        type="text"
                        placeholder="Nama Anda"
                        class="w-full text-center p-4 border border-gray-300 rounded-xl
                        focus:outline-none focus:ring-2 focus:ring-blue-500
                        focus:border-blue-500 transition duration-300">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-center font-semibold text-gray-700 mb-2">
                        Judul Pengakuan
                    </label>

                    <input
                        type="text"
                        placeholder="Judul Pengakuan Yang Ingin Anda Adukan"
                        class="w-full text-center p-4 border border-gray-300 rounded-xl
                        focus:outline-none focus:ring-2 focus:ring-blue-500
                        focus:border-blue-500 transition duration-300">
                </div>

                <!-- Message -->
                <div>
                    <label class="block text-center font-semibold text-gray-700 mb-2">
                        Deskripsi Pengakuan
                    </label>

                    <textarea
                        rows="5"
                        placeholder="Deskripsi Pengakuan"
                        class="w-full text-center p-4 border border-gray-300 rounded-xl
                        resize-none focus:outline-none focus:ring-2
                        focus:ring-blue-500 focus:border-blue-500
                        transition duration-300"></textarea>
                </div>

                <!-- Button -->
                <button
                    type="submit"
                    class="w-full py-4 rounded-xl bg-gradient-to-r
                    from-blue-600 to-indigo-600 text-white font-semibold
                    text-lg shadow-lg hover:shadow-2xl
                    hover:scale-105 transition duration-300">
                    🚀 Kirim Pengakuan
                </button>

            </form>

        </div>

    </section>

</body>
</html>
