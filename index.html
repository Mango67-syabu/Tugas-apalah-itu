<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tugas Mingguan</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gradient-to-br from-blue-100 via-white to-blue-200">


<!-- HALAMAN MENU -->

<section id="menu" class="min-h-screen flex items-center justify-center px-4">


<div class="bg-white w-full max-w-xl rounded-3xl shadow-2xl p-8">


<h1 class="text-4xl font-bold text-center text-gray-800 mb-8">
Tugas Mingguan
</h1>



<button onclick="bukaForm1()"
class="w-full py-4 mb-4 rounded-xl bg-black text-white text-lg hover:scale-105 transition">

Form Social 

</button>



<button onclick="bukaForm2()"
class="w-full py-4 rounded-xl bg-black text-white text-lg hover:scale-105 transition">

Menu

</button>


</div>


</section>






<!-- FORM SOCIAL 1 -->

<section id="form1" class="hidden min-h-screen flex items-center justify-center px-4">


<div class="bg-white w-full max-w-xl rounded-3xl shadow-2xl p-8">


<h1 class="text-4xl font-bold text-center text-gray-800 mb-8">
Aduan Sosial
</h1>




<label class="block text-center font-semibold mb-2">
Nama
</label>


<input
type="text"
placeholder="Nama Anda"
class="w-full text-center p-4 border rounded-xl mb-5">





<label class="block text-center font-semibold mb-2">
Judul Pengaduan
</label>


<input
type="text"
placeholder="Judul Pengaduan Yang Ingin Anda Adukan"
class="w-full text-center p-4 border rounded-xl mb-5">





<label class="block text-center font-semibold mb-2">
Deskripsi Pengaduan
</label>


<textarea
rows="5"
placeholder="Deskripsi Pengaduan"
class="w-full text-center p-4 border rounded-xl resize-none mb-5">
</textarea>






<button
class="w-full py-4 rounded-xl bg-blue-600 text-white text-lg font-semibold hover:scale-105 transition">

🚀 Kirim Pengaduan

</button>





<button onclick="kembali()"
class="w-full mt-4 py-3 rounded-xl bg-gray-700 text-white">

Kembali

</button>


</div>


</section>









<!-- FORM SOCIAL 2 / MENU MAKANAN -->

<section id="form2" class="hidden min-h-screen flex items-center justify-center px-4">


<div class="bg-white w-full max-w-xl rounded-3xl shadow-2xl p-8">


<h1 class="text-4xl font-bold text-center text-orange-600 mb-8">
🍽 MENU
</h1>





<h2 class="text-xl font-bold text-center text-gray-700 mb-4">
Makanan
</h2>



<div class="flex justify-between border-b py-3">

<span class="font-semibold">
Nasi Goreng
</span>

<span class="text-orange-600 font-bold">
Rp18.000
</span>

</div>




<div class="flex justify-between border-b py-3">

<span class="font-semibold">
Nasi Ruwet
</span>

<span class="text-orange-600 font-bold">
Rp22.000
</span>

</div>





<div class="flex justify-between border-b py-3">

<span class="font-semibold">
Ayam Geprek
</span>

<span class="text-orange-600 font-bold">
Rp15.000
</span>

</div>







<h2 class="text-xl font-bold text-center text-gray-700 mt-8 mb-4">
Minuman
</h2>




<div class="flex justify-between border-b py-3">

<span class="font-semibold">
Es Teh
</span>

<span class="text-orange-600 font-bold">
Rp5.000
</span>

</div>





<div class="flex justify-between border-b py-3">

<span class="font-semibold">
Es Jeruk
</span>

<span class="text-orange-600 font-bold">
Rp8.000
</span>

</div>





<div class="flex justify-between py-3">

<span class="font-semibold">
Kopi Susu
</span>

<span class="text-orange-600 font-bold">
Rp10.000
</span>

</div>






<p class="text-center text-gray-500 mt-8">
Selamat Menikmati ❤️
</p>





<button onclick="kembali()"
class="w-full mt-6 py-3 rounded-xl bg-gray-700 text-white">

Kembali

</button>



</div>


</section>








<script>


function bukaForm1(){

document.getElementById("menu").classList.add("hidden");

document.getElementById("form1").classList.remove("hidden");

}




function bukaForm2(){

document.getElementById("menu").classList.add("hidden");

document.getElementById("form2").classList.remove("hidden");

}




function kembali(){

document.getElementById("menu").classList.remove("hidden");

document.getElementById("form1").classList.add("hidden");

document.getElementById("form2").classList.add("hidden");

}



</script>



</body>
</html>
